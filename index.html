<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Digital Evolution: Neo-Fractal</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #030208; width: 100%; height: 100%; }
        canvas { width: 100vw; height: 100vh; display: block; }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');

        let time = 0;
        
        // Генетические параметры биоморфа (меняются в ходе «эволюции»)
        let genes = {
            angleStep: 0.4,
            lengthRatio: 0.75,
            maxDepth: 10,
            hueBase: 180,
            pulseSpeed: 1.2
        };

        // Плавное изменение генов со временем (мутация)
        function mutateGenes(t) {
            genes.angleStep = 0.35 + Math.sin(t * 0.2) * 0.15 + Math.cos(t * 0.05) * 0.1;
            genes.lengthRatio = 0.72 + Math.sin(t * 0.1) * 0.04;
            genes.maxDepth = 9 + Math.floor((Math.sin(t * 0.05) + 1) * 1.5); // Дерево растет и усложняется
            genes.hueBase = (t * 10) % 360; // Плавная мутация цвета структуры
        }

        // Рекурсивная функция выращивания фрактального биоморфа
        function drawBranch(x, y, length, angle, depth, pulse) {
            if (depth > genes.maxDepth) return;

            // Вычисляем конечную точку ветви с учетом био-пульсации
            const dynamicLength = length * (1 + Math.sin(time * genes.pulseSpeed + depth) * pulse);
            const x2 = x + Math.cos(angle) * dynamicLength;
            const y2 = y + Math.sin(angle) * dynamicLength;

            // Динамический неоновый цвет для каждого уровня вложенности
            const branchHue = (genes.hueBase + depth * 15) % 360;
            const alpha = 1.0 - (depth / genes.maxDepth) * 0.6; // Прозрачность к кончикам
            
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x2, y2);
            
            // Толщина уменьшается с ростом глубины
            ctx.lineWidth = Math.max(0.5, (genes.maxDepth - depth) * 0.8);
            ctx.strokeStyle = `hsla(${branchHue}, 90%, 65%, ${alpha})`;
            ctx.shadowColor = `hsl(${branchHue}, 100%, 50%)`;
            ctx.shadowBlur = depth < 4 ? 15 : 0; // Свечение только на основных ветвях для оптимизации
            ctx.stroke();

            // Генетическое ветвление: порождаем новые цифровые побеги
            // Добавляем легкую асимметрию за счет времени
            const angleOffset = genes.angleStep + Math.sin(time * 0.5 + depth) * 0.03;

            // Левая ветвь
            drawBranch(x2, y2, length * genes.lengthRatio, angle - angleOffset, depth + 1, pulse);
            // Правая ветвь
            drawBranch(x2, y2, length * genes.lengthRatio, angle + angleOffset, depth + 1, pulse);
            
            // Центральный редкий побег (эффект усложнения мутации на пике эволюции)
            if (depth > 3 && depth % 3 === 0) {
                drawBranch(x2, y2, length * 0.4, angle + Math.sin(time)*0.1, depth + 2, pulse);
            }
        }

        function render() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            time += 0.015;

            // Шлейф старых кадров для эффекта размытия движения (motion blur)
            ctx.fillStyle = "rgba(3, 2, 8, 0.08)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Запускаем мутацию ДНК фрактала
            mutateGenes(time);

            const startX = canvas.width / 2;
            const startY = canvas.height * 0.82; // Точка роста
            const initialLength = Math.min(canvas.width, canvas.height) * 0.18;

            // Сброс тени перед отрисовкой во избежание багов холста
            ctx.shadowBlur = 0; 

            // Рисуем светящиеся споры на фоне (цифровая питательная среда)
            ctx.fillStyle = `rgba(255, 255, 255, 0.15)`;
            for(let i = 0; i < 15; i++) {
                let sX = (Math.sin(i * 123 + time * 0.2) * 0.5 + 0.5) * canvas.width;
                let sY = (Math.cos(i * 456 + time * 0.3) * 0.5 + 0.5) * canvas.height;
                ctx.fillRect(sX, sY, 1.5, 1.5);
            }

            // Выращиваем биоморф вверх (-Math.PI / 2)
            // Коэффициент пульсации 0.08 задает амплитуду "дыхания"
            drawBranch(startX, startY, initialLength, -Math.PI / 2, 0, 0.08);

            requestAnimationFrame(render);
        }

        // Стартовый запуск
        requestAnimationFrame(render);
    </script>
</body>
</html>
